<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fishing Activity Map</title>

  <!-- Leaflet: the map library (CSS for its controls + the JavaScript) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Left-hand panel with the controls -->
  <aside class="sidebar">
    <header>
      <h1>Fishing Activity</h1>
      <p class="subtitle">Apparent fishing effort from AIS data · Global Fishing Watch</p>
    </header>

    <form id="map-form">
      <section class="panel">
        <h2>Date range</h2>
        <div class="two-col">
          <label>From <input type="date" id="start-date" required></label>
          <label>To <input type="date" id="end-date" required></label>
        </div>
      </section>

      <section class="panel">
        <h2>Filters</h2>
        <label class="field">Flag (country)
          <select id="flag-select"><option value="">All flags</option></select>
        </label>
        <label class="field">Gear type
          <select id="gear-select"><option value="">All gear types</option></select>
        </label>
      </section>

      <button type="submit" class="primary">Update map</button>
      <div class="download-row">
        <select id="download-resolution" aria-label="Download detail">
          <option value="DAILY">Daily</option>
          <option value="HOURLY">Hourly</option>
        </select>
        <select id="download-format" aria-label="File type">
          <option value="xlsx">Excel</option>
          <option value="chart">Charts</option>
          <option value="csv">CSV (raw)</option>
        </select>
        <button type="button" id="download-csv-button" class="download">Download</button>
      </div>
    </form>

    <section class="panel">
      <h2>Region</h2>
      <!-- Buttons are added here by app.js from the server's region list -->
      <div id="region-buttons" class="chip-grid">
        <button type="button" class="chip active" data-region="">Whole world</button>
      </div>
      <button type="button" id="draw-area" class="chip draw-chip">&#9633; Draw an area</button>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>Fishing hours</h2>
        <div class="toggle" role="group" aria-label="Group fishing hours by">
          <button type="button" class="active" data-group="FLAG">By flag</button>
          <button type="button" data-group="GEARTYPE">By gear</button>
        </div>
      </div>
      <p id="stats-caption" class="hint"></p>
      <div id="stats-chart" class="bar-chart"></div>
    </section>

    <section class="panel">
      <h2>Vessel search</h2>
      <form id="vessel-form" class="search-row">
        <input type="search" id="vessel-query" placeholder="Name, MMSI or IMO" minlength="3" required>
        <button type="submit">Search</button>
      </form>
      <p id="vessel-status" class="hint"></p>
      <ul id="vessel-results" class="result-list"></ul>
    </section>

    <section class="panel">
      <h2>Legend</h2>
      <div class="legend-bar"></div>
      <div class="legend-labels"><span>Less fishing</span><span>More fishing</span></div>
    </section>

    <p id="status" class="status" role="status"></p>
  </aside>

  <!-- The map fills the rest of the screen; the vessel panel floats over it -->
  <main class="map-wrap">
    <div id="map"></div>
    <aside id="vessel-panel" class="drawer" hidden>
      <button type="button" id="vessel-close" class="close" aria-label="Close">&times;</button>
      <div id="vessel-details"></div>
    </aside>
  </main>

  <!-- A filter that makes the heatmap brighter: GFW paints quiet areas almost
       see-through, so we multiply each pixel's opacity by 4 and add a soft glow. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="heat-glow">
      <feComponentTransfer>
        <feFuncA type="linear" slope="4" />
      </feComponentTransfer>
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </svg>

  <script src="app.js"></script>
  <script src="vessels.js"></script>
  <script src="stats.js"></script>
  <!-- Full-screen chart view, filled in by charts.js ("Charts" option) -->
  <section id="chart-view" class="chart-view" hidden aria-label="Fishing activity charts">
    <header class="cv-head">
      <div>
        <h2>Fishing activity</h2>
        <p id="cv-subtitle" class="cv-sub"></p>
      </div>
      <button type="button" id="cv-close" class="cv-close" aria-label="Close charts">&times;</button>
    </header>
    <p id="cv-message" class="cv-message"></p>
    <div id="cv-content" hidden>
      <div id="cv-tiles" class="cv-tiles"></div>

      <article class="cv-card">
        <div class="cv-card-head">
          <div class="toggle" role="group" aria-label="Main chart">
            <button type="button" class="active" data-view="map">Hotspot map</button>
            <button type="button" data-view="countries">Countries by day</button>
          </div>
          <p id="cv-hint" class="cv-hint"></p>
        </div>
        <p id="cv-caption" class="cv-caption"></p>
        <div id="cv-map" class="cv-main"></div>
        <div id="cv-heat" class="cv-main" hidden></div>
      </article>

      <div class="cv-grid">
        <article class="cv-card">
          <h3>Fishing per day</h3>
          <div id="cv-daily" class="cv-2d"></div>
        </article>
        <article class="cv-card">
          <h3>Which countries' boats</h3>
          <div id="cv-countries" class="cv-2d"></div>
        </article>
        <article class="cv-card">
          <h3>Fishing methods</h3>
          <div id="cv-gear" class="cv-2d"></div>
        </article>
      </div>
    </div>
  </section>
  <script src="charts.js"></script>

  <!-- Shown by app.js before a big Excel/CSV download. The button pressed
       becomes the dialog's returnValue: "download", "charts" or "cancel". -->
  <dialog id="size-warning" class="size-warning" aria-labelledby="size-warning-title">
    <form method="dialog">
      <h2 id="size-warning-title"></h2>
      <p id="size-warning-text"></p>
      <div class="sw-buttons">
        <button value="cancel" class="sw-secondary">Cancel</button>
        <button value="charts" class="sw-secondary">Show charts instead</button>
        <button value="download" class="primary">Download anyway</button>
      </div>
    </form>
  </dialog>

  <!-- Floating tooltip shared by the chart -->
  <div id="tooltip" class="tooltip" hidden></div>
</body>
</html>
